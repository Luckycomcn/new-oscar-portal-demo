server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    set $amap_security_js_code "${AMAP_SECURITY_JS_CODE}";

    location /_AMapService/v4/map/styles {
        if ($amap_security_js_code = "") { return 503; }
        set $args "$args&jscode=$amap_security_js_code";
        proxy_ssl_server_name on;
        proxy_set_header Host webapi.amap.com;
        proxy_pass https://webapi.amap.com/v4/map/styles;
    }

    location /_AMapService/ {
        if ($amap_security_js_code = "") { return 503; }
        set $args "$args&jscode=$amap_security_js_code";
        proxy_ssl_server_name on;
        proxy_set_header Host restapi.amap.com;
        proxy_pass https://restapi.amap.com/;
    }
    location = /wmdr-source {
        proxy_pass https://oscar.wmo.int/oai/provider;
        proxy_set_header Host oscar.wmo.int;
        proxy_ssl_server_name on;
    }

    # Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff font/woff2;

    # Long-lived cache for hashed build assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Do not cache the entry document.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hash routing needs no history fallback, but fall back to index.html
    # so that any unknown path still boots the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

}

