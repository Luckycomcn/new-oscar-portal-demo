<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>新一代 WIGOS 元数据系统门户 · 演示原型</title>
<meta name="description" content="新一代 OSCAR / WIGOS 元数据系统门户（Portal）组件演示原型：检索、记录展示、地图与空间、导出与互操作、运行支撑" />
<link rel="stylesheet" href="assets/css/app.css" />
<link rel="stylesheet" href="assets/css/doc.css" />
<link rel="stylesheet" href="assets/css/only.css" />
</head>
<body data-theme="dark">

<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/>
      <circle cx="16" cy="16" r="8.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="2.6" fill="currentColor"/>
      <path d="M16 2v5M16 25v5M2 16h5M25 16h5" stroke="currentColor" stroke-width="1.2"/>
    </svg>
    <div class="brand-text">
      <strong data-i18n="app.title">新一代 WIGOS 元数据系统门户</strong>
      <span data-i18n="app.subtitle">Portal 组件 · 只读演示原型</span>
    </div>
  </div>

  <nav class="nav" id="nav">
    <a href="#/overview" data-route="overview" data-i18n="nav.overview">总览</a>
    <a href="#/search"   data-route="search"   data-i18n="nav.search">检索</a>
    <a href="#/map"      data-route="map"      data-i18n="nav.map">地图</a>
    <a href="#/edit"     data-route="edit"     data-i18n="nav.edit">维护</a>
    <a href="#/users"    data-route="users"    data-i18n="nav.users">用户</a>
    <a href="#/export"   data-route="export"   data-i18n="nav.export">导出</a>
    <a href="#/ops"      data-route="ops"      data-i18n="nav.ops">运行支撑</a>
  </nav>

  <div class="tools">
    <button class="ghost" id="btn-lang" title="中文 / English">中 / EN</button>
    <button class="ghost" id="btn-theme" title="主题">◐</button>
    <button class="ghost" id="whoami" title="演示身份">—</button>
    <span class="ro-badge" data-i18n="app.readonly">门户只读 · 维护沙箱演示</span>
  </div>
</header>

<main id="app" class="app">
  <div class="boot">
    <div class="boot-ring"></div>
    <p data-i18n="app.loading">正在载入本地缓存的目录数据…</p>
  </div>
</main>

<footer class="footer">
  <div>
    <span data-i18n="footer.source">数据来源</span>：
    <a href="https://oscar.wmo.int/surface/" target="_blank" rel="noopener">WMO OSCAR / Surface（现役系统）</a>
    · <span id="foot-snapshot">—</span>
  </div>
  <div class="muted" data-i18n="footer.note">演示原型 · 数据为现役系统真实记录的部分缓存 · 元数据维护请前往 WIGOS 节点</div>
</footer>

<div class="toast" id="toast" hidden></div>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
