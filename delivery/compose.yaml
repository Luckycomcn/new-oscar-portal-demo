services:
  web:
    image: oscar-surface:1.0.0
    pull_policy: never
    environment:
      AMAP_SECURITY_JS_CODE: "${VITE_AMAP_SECURITY_JS_CODE:?Set VITE_AMAP_SECURITY_JS_CODE in the deployment .env}"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
